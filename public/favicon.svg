<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A2C2A"/>
      <stop offset="100%" stop-color="#2D1810"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- saucer -->
  <ellipse cx="32" cy="52" rx="28" ry="6" fill="#5C3A34"/>
  <ellipse cx="32" cy="51" rx="26" ry="5" fill="#6B443A"/>
  <!-- cup body -->
  <path d="M12 22 L12 44 Q12 52 32 52 Q52 52 52 44 L52 22 Z" fill="url(#cup)"/>
  <!-- handle -->
  <path d="M52 26 Q62 26 62 34 Q62 42 52 42" fill="none" stroke="#4A2C2A" stroke-width="5" stroke-linecap="round"/>
  <!-- coffee surface -->
  <ellipse cx="32" cy="24" rx="20" ry="8" fill="#1A0F0A"/>
  <!-- crema highlight -->
  <ellipse cx="32" cy="23" rx="16" ry="5" fill="#3D2218" opacity="0.7"/>
  <!-- steam -->
  <path d="M24 18 Q22 8 26 2" fill="none" stroke="url(#steam)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 16 Q30 4 34 -2" fill="none" stroke="url(#steam)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 18 Q38 8 42 2" fill="none" stroke="url(#steam)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
