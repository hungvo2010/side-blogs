<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tien's Blog</title>
    <meta name="description" content="Personal blog - powered by Cloudflare Pages">
    <meta property="og:title" content="Tien's Blog">
    <meta property="og:description" content="Personal blog - powered by Cloudflare Pages">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://side-blogs.pages.dev">
    <style>
        :root{--primary:#1a73e8;--text:#1f2937;--muted:#6b7280;--bg:#fff}
        *{box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;color:var(--text);background:#f8fafc;margin:0}
        nav{background:var(--bg);border-bottom:1px solid #e5e7eb;padding:12px 0}
        nav .inner{max-width:800px;margin:0 auto;padding:0 20px;font-weight:600;color:var(--primary)}
        .container{max-width:800px;margin:80px auto;padding:0 20px;text-align:center}
        h1{font-size:2.5rem;margin-bottom:8px}
        p{color:var(--muted);font-size:1.15rem;margin-bottom:32px}
        .status{display:inline-block;padding:4px 14px;border-radius:999px;font-size:.8rem;font-weight:500;background:#dcfce7;color:#166534}
        footer{text-align:center;color:var(--muted);font-size:.85rem;padding:32px 0}
        footer a{color:var(--primary)}
    </style>
</head>
<body>
<nav><div class="inner">Tien's Blog</div></nav>
<main class="container">
    <h1>🚀 Coming Soon</h1>
    <p>Static blog powered by Cloudflare Pages. Content pipeline in progress.</p>
    <span class="status">● Live on Cloudflare Pages</span>
</main>
<footer>
    <p><a href="https://github.com/hungvo2010/side-blogs">hungvo2010/side-blogs</a> · Powered by <a href="https://pages.cloudflare.com">Cloudflare Pages</a></p>
</footer>
</body>
</html>
