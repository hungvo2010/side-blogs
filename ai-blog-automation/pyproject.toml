[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-blog-automation"
version = "0.1.0"
description = "Automated AI content generation, fact-checking, and publishing platform"
authors = ["Developer <dev@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "blog_automation", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
sqlalchemy = "^2.0.23"

pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
openai = ">=1.50.0"
markdown2 = "^2.4.12"
httpx = "^0.26.0"
tenacity = "^8.2.3"
psycopg2-binary = "^2.9.9"
structlog = "^23.3.0"
streamlit = "^1.29.0"
plotly = "^5.18.0"
langchain-openai = ">=0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.23.2"
factory-boy = "^3.3.0"
black = "^23.12.1"
flake8 = "^6.1.0"
mypy = "^1.8.0"
isort = "^5.13.2"
pre-commit = "^3.6.0"
responses = "^0.24.1"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
# Ruff replaces flake8 + isort + black for linting/formatting validation.
# Aligned with the existing black config (line-length 88, py311).
line-length = 88
target-version = "py311"
extend-exclude = ["dist"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort (profile-compatible with black).
select = ["E", "W", "F", "I"]
ignore = ["E203"]  # whitespace before ':' — black-compatible ignore

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/blog_automation"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
